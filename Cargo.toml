[package]
name = "training-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
validator = { version = "0.20", default-features = false }
unicase = "2.9"

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
